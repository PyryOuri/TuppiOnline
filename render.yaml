# Prepared deployment configuration. No paid resource has been created.
services:
  - type: web
    name: tuppi-online
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    healthCheckPath: /healthz
    autoDeployTrigger: off
    # No maxShutdownDelaySeconds: Render rejects it for a service with a disk
    # (DEP-01) and stops it within its default 30 seconds; start.sh drains in 10.
    disk:
      name: tuppi-rooms
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: TUPPI_SERVER_DATA_DIR
        value: /data/rooms
      - key: TUPPI_WEB_DIR
        value: /app/web
      # The owner's key for downloading the anonymous match records
      # (/v1/research/matches?key=...); without it there is no download.
      # sync: false: a secret, never stored in the repo. On an existing
      # service, add it under Environment.
      - key: TUPPI_RESEARCH_KEY
        sync: false
      # Room-creation passcode (8-128 characters). sync: false makes Render ask
      # for it when the Blueprint is created; it is never stored in the repo.
      - key: TUPPI_ROOM_PASSCODE
        sync: false
