[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuppi-research"
version = "0.12.0"
description = "Deterministic Tuppi rules and research infrastructure with a private-alpha server, protocol fixtures, and optional learned-policy experiments"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100,<7",
  "jsonschema>=4.20,<5",
  "pytest>=8,<9",
]
learning = [
  "numpy>=2,<3",
  "torch>=2.13,<2.14",
]
server = [
  "uvicorn>=0.30,<1",
  "websockets>=13,<17",
]

[project.scripts]
tuppi-legacy = "tuppi_legacy.run:entrypoint"
tuppi-engine = "tuppi_engine.runner:entrypoint"
tuppi-eval = "tuppi_eval.runner:entrypoint"
tuppi-agents = "tuppi_agents.runner:entrypoint"
tuppi-match = "tuppi_match.runner:entrypoint"
tuppi-exact = "tuppi_exact.runner:entrypoint"
tuppi-search = "tuppi_search.runner:entrypoint"
tuppi-ui-fixtures = "tuppi_ui_fixtures.exporter:main"
tuppi-server = "tuppi_server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
