[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuppi-research"
version = "0.5.1"
description = "Deterministic Tuppi rules, engine, deal and complete-match evaluation, baseline agents, exact inference and solving, and legacy archive"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
dev = [
  "hypothesis>=6.100,<7",
  "jsonschema>=4.20,<5",
  "pytest>=8,<9",
]

[project.scripts]
tuppi-legacy = "tuppi_legacy.run:entrypoint"
tuppi-engine = "tuppi_engine.runner:entrypoint"
tuppi-eval = "tuppi_eval.runner:entrypoint"
tuppi-agents = "tuppi_agents.runner:entrypoint"
tuppi-match = "tuppi_match.runner:entrypoint"
tuppi-exact = "tuppi_exact.runner:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/tuppi-legacy/Archive" = [
  "Archive/tuppi_emulator_v9.py",
  "Archive/tuppi_gui_client_multi_v8.py",
]
"share/tuppi-legacy/manifests" = ["manifests/legacy_v9.json"]
"share/tuppi-legacy/schemas" = [
  "schemas/legacy_deal.schema.json",
  "schemas/legacy_deal_set.schema.json",
  "schemas/legacy_result.schema.json",
]
"share/tuppi-legacy/docs" = ["docs/phase0_audit.md"]
"share/tuppi-rules/configs/rules" = ["configs/rules/project_target_v1.json"]
"share/tuppi-rules/schemas" = ["schemas/ruleset.schema.json"]
"share/tuppi-rules/docs/rules" = [
  "docs/rules/project_target_v1.md",
  "docs/rules/project_target_v1.fi.md",
  "docs/rules/project_target_v1_decisions.md",
]
"share/tuppi-rules/examples/project_target_v1" = [
  "examples/rules/project_target_v1/README.md",
  "examples/rules/project_target_v1/show_actions.json",
  "examples/rules/project_target_v1/contract_resolution.json",
  "examples/rules/project_target_v1/deal_scoring.json",
  "examples/rules/project_target_v1/match_transitions.json",
]
"share/tuppi-engine/schemas" = [
  "schemas/engine/explicit_deal.schema.json",
  "schemas/engine/match_input.schema.json",
  "schemas/engine/agent_script.schema.json",
  "schemas/engine/public_event_log.schema.json",
  "schemas/engine/deal_result.schema.json",
  "schemas/engine/match_result.schema.json",
  "schemas/engine/player_observation.schema.json",
  "schemas/engine/research_result.schema.json",
]
"share/tuppi-engine/docs" = [
  "docs/engine/architecture.md",
  "docs/engine/state_machine.md",
  "docs/engine/observation_security.md",
  "docs/engine/serialization.md",
]
"share/tuppi-engine/examples/project_target_v1" = [
  "examples/engine/project_target_v1/README.md",
  "examples/engine/project_target_v1/generate_examples.py",
  "examples/engine/project_target_v1/valid_one_deal_match.json",
  "examples/engine/project_target_v1/full_nolo_script.json",
  "examples/engine/project_target_v1/successful_rami_match.json",
  "examples/engine/project_target_v1/successful_rami_script.json",
  "examples/engine/project_target_v1/stolen_rami_match.json",
  "examples/engine/project_target_v1/stolen_rami_script.json",
  "examples/engine/project_target_v1/verbal_fallback_match.json",
  "examples/engine/project_target_v1/verbal_fallback_script.json",
  "examples/engine/project_target_v1/no_eligible_show_match.json",
  "examples/engine/project_target_v1/no_eligible_show_script.json",
  "examples/engine/project_target_v1/exact_52_match.json",
  "examples/engine/project_target_v1/exact_52_script.json",
  "examples/engine/project_target_v1/invalid_duplicate_card_deal.json",
]
"share/tuppi-eval/schemas" = [
  "schemas/evaluation/agent_spec.schema.json",
  "schemas/evaluation/team_spec.schema.json",
  "schemas/evaluation/deal_bank.schema.json",
  "schemas/evaluation/evaluation_config.schema.json",
  "schemas/evaluation/schedule.schema.json",
  "schemas/evaluation/game_record.schema.json",
  "schemas/evaluation/duplicate_block_record.schema.json",
  "schemas/evaluation/evaluation_result.schema.json",
  "schemas/evaluation/crossplay_matrix.schema.json",
  "schemas/evaluation/promotion_decision.schema.json",
]
"share/tuppi-eval/docs" = [
  "docs/evaluation/architecture.md",
  "docs/evaluation/duplicate_design.md",
  "docs/evaluation/statistics.md",
  "docs/evaluation/reproducibility.md",
  "docs/evaluation/agent_registry.md",
]
"share/tuppi-eval/examples" = [
  "examples/evaluation/README.md",
  "examples/evaluation/generate_examples.py",
  "examples/evaluation/benchmark_smoke.py",
  "examples/evaluation/small_deal_bank.json",
  "examples/evaluation/baseline_comparison.json",
  "examples/evaluation/homogeneous_vs_heterogeneous.json",
  "examples/evaluation/duplicate_block.json",
  "examples/evaluation/baseline_crossplay.json",
  "examples/evaluation/small_crossplay_matrix.json",
  "examples/evaluation/structured_failure.json",
  "examples/evaluation/interrupted_resume.json",
  "examples/evaluation/synthetic_statistics.json",
  "examples/evaluation/promotion_decision.json",
]

"share/tuppi-agents/schemas" = [
  "schemas/agents/heuristic_profile.schema.json",
  "schemas/agents/strategy_rule_catalogue.schema.json",
  "schemas/agents/decision_diagnostics.schema.json",
  "schemas/agents/baseline_report.schema.json",
]
"share/tuppi-agents/docs" = [
  "docs/agents/architecture.md",
  "docs/agents/public_inference.md",
  "docs/agents/baseline_profiles.md",
  "docs/agents/legacy_port.md",
  "docs/agents/strategy_rule_catalogue.md",
  "docs/agents/phase4_evaluation.md",
]
"share/tuppi-agents/examples" = [
  "examples/agents/README.md",
  "examples/agents/generate_examples.py",
  "examples/agents/render_report.py",
  "examples/agents/strategy_rule_catalogue.json",
  "examples/agents/heuristic_profiles.json",
  "examples/agents/phase4_agents.json",
  "examples/agents/ladder_fixed_deal.json",
  "examples/agents/decision_diagnostics.json",
  "examples/agents/legacy_port_compatibility.json",
]
"share/tuppi-agents/banks" = [
  "banks/phase4_development_deal_v1.json",
  "banks/phase4_development_deal_up_v1.json",
  "banks/phase4_crossplay_v1.json",
  "banks/phase4_development_match_v1.json",
]
"share/tuppi-agents/reports" = ["reports/phase4/baseline_report.json"]
"share/tuppi-match/docs" = [
  "docs/match/complete_match_protocol.md",
  "docs/match/endpoints.md",
  "docs/match/censoring.md",
  "docs/match/bank_lifecycle.md",
  "docs/match/calibration.md",
  "docs/match/phase5a_results.md",
]
"share/tuppi-match/reports" = [
  "reports/phase5a/phase4_frozen_agents.json",
  "reports/phase5a/calibration_report.json",
  "reports/phase5a/score_state_diagnostics.json",
  "reports/phase5a/match_length_calibration.json",
  "reports/phase5a/sealed_commitment.json",
]
"share/tuppi-exact/schemas" = [
  "schemas/exact/frozen_baseline.schema.json",
  "schemas/exact/hidden_hand_sampling.schema.json",
  "schemas/exact/late_game_solution.schema.json",
  "schemas/exact/match_rule_diagnosis.schema.json",
]
"share/tuppi-exact/docs" = [
  "docs/exact/architecture.md",
  "docs/exact/constraint_model.md",
  "docs/exact/counting_and_sampling.md",
  "docs/exact/continuation.md",
  "docs/exact/solver.md",
  "docs/exact/integrity.md",
  "docs/exact/phase5b_results.md",
]
"share/tuppi-exact/reports" = [
  "reports/phase5b/frozen_baseline.json",
  "reports/phase5b/match_rule_diagnosis.json",
]

[tool.pytest.ini_options]
testpaths = [
  "tests/legacy_characterization",
  "tests/archival_harness",
  "tests/rules/project_target_v1",
  "tests/engine",
  "tests/evaluation",
  "tests/agents",
  "tests/match",
  "tests/exact",
]
addopts = "-ra"
